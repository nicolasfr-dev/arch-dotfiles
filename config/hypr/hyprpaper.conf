# hyprpaper - Tokyo Night
# O wallpaper e gerado por scripts/gen-wallpaper.py (rodado pelo install.sh)

preload = ~/.local/share/wallpapers/tokyonight.png

wallpaper = eDP-1,~/.local/share/wallpapers/tokyonight.png
wallpaper = HDMI-A-1,~/.local/share/wallpapers/tokyonight.png

# fallback para qualquer monitor novo
wallpaper = ,~/.local/share/wallpapers/tokyonight.png

splash = false
ipc = on
