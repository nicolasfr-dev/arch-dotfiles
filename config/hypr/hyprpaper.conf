# hyprpaper - Tokyo Night
#
# ATENCAO: o hyprpaper 0.8.x mudou o formato de config. O antigo
#   preload = <path>
#   wallpaper = <monitor>,<path>
# foi substituido por blocos "wallpaper { }" e o "preload" deixou de existir.
# Com o formato antigo ele nao reclama nada, so loga
# "Monitor <X> has no target: no wp will be created" e fica sem papel de parede.
#
# O wallpaper e gerado por scripts/gen-wallpaper.py (rodado pelo install.sh).

splash = false
ipc = on

wallpaper {
    monitor = eDP-1
    path = ~/.local/share/wallpapers/tokyonight.png
}

wallpaper {
    monitor = HDMI-A-1
    path = ~/.local/share/wallpapers/tokyonight.png
}

# fallback: qualquer monitor sem regra propria
wallpaper {
    monitor =
    path = ~/.local/share/wallpapers/tokyonight.png
}
