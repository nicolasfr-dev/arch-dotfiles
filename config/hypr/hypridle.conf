# hypridle - regras de inatividade (notebook)
#
# NAO ha bloqueio automatico de tela. O login no TTY durante o boot ja autentica
# a sessao (sem display manager, sem autologin), entao travar de novo por
# inatividade seria pedir a senha duas vezes no mesmo uso.
# Bloqueio manual: SUPER+L.

general {
    # so dispara se alguem chamar `loginctl lock-session` explicitamente
    lock_cmd = pidof hyprlock || hyprlock --grace 2
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# 2min30 -> escurece a tela (guarda o brilho anterior)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 2min30 -> apaga o LED do teclado, se existir
listener {
    timeout = 150
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0
    on-resume = brightnessctl -rd rgb:kbd_backlight
}

# 5min30 -> desliga a tela
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on && brightnessctl -r
}

# 30min -> suspende (sem bloquear: nao ha before_sleep_cmd)
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
