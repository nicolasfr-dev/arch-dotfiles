# hyprlock - Tokyo Night

$bg        = rgb(1a1b26)
$bg_dark   = rgb(16161e)
$surface   = rgb(24283b)
$fg        = rgb(c0caf5)
$fg_dark   = rgb(a9b1d6)
$comment   = rgb(565f89)
$blue      = rgb(7aa2f7)
$cyan      = rgb(7dcfff)
$magenta   = rgb(bb9af7)
$orange    = rgb(ff9e64)
$red       = rgb(f7768e)

$font      = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    fail_timeout = 2000
    # o antigo "grace" virou flag de CLI: ver lock_cmd em hypridle.conf
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 4, linear
    animation = fadeOut, 1, 4, linear
    animation = inputFieldDots, 1, 1.5, linear
}

background {
    monitor =
    path = $HOME/.local/share/wallpapers/tokyonight.png
    blur_passes = 3
    blur_size = 6
    noise = 0.0117
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.17
}

# ---------- relógio ----------
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $fg
    font_size = 92
    font_family = $font ExtraBold
    position = 0, 80
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0,0,0,0.6)
}

# ---------- data ----------
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d de %B"
    color = $fg_dark
    font_size = 17
    font_family = $font
    position = 0, 10
    halign = center
    valign = center
}

# ---------- avatar / usuário ----------
label {
    monitor =
    text =   $USER
    color = $blue
    font_size = 15
    font_family = $font Bold
    position = 0, -70
    halign = center
    valign = center
}

# ---------- campo de senha ----------
input-field {
    monitor =
    size = 300, 48
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1

    outer_color = $comment
    inner_color = $surface
    font_color = $fg
    check_color = $orange
    fail_color = $red
    capslock_color = $magenta

    fade_on_empty = false
    rounding = 12
    placeholder_text = <span foreground="##565f89">Senha…</span>
    fail_text = <span foreground="##f7768e">$FAIL (tentativa $ATTEMPTS)</span>
    hide_input = false

    position = 0, -140
    halign = center
    valign = center
}

# ---------- bateria ----------
label {
    monitor =
    text = cmd[update:30000] printf "󰁹 %s%%" "$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1)"
    color = $fg_dark
    font_size = 13
    font_family = $font
    position = -25, -20
    halign = right
    valign = top
}

# ---------- layout de teclado ----------
label {
    monitor =
    text = 󰌌  br-abnt2
    color = $comment
    font_size = 12
    font_family = $font
    position = 25, -20
    halign = left
    valign = top
}

# ---------- dica ----------
label {
    monitor =
    text = Enter para desbloquear
    color = $comment
    font_size = 11
    font_family = $font
    position = 0, 30
    halign = center
    valign = bottom
}
