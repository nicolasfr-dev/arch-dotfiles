# foot - Tokyo Night

[main]
term=foot
font=InputMono Nerd Font:size=11
font-bold=InputMono Nerd Font Medium:size=11
font-italic=InputMonoIta Nerd Font:size=11
line-height=16
pad=10x10 center
dpi-aware=no

[environment]
COLORTERM=truecolor

[cursor]
style=beam
beam-thickness=1.5
blink=yes

[mouse]
hide-when-typing=yes

[scrollback]
lines=10000
multiplier=3

[url]
launch=xdg-open ${url}
osc8-underline=url-mode

# foot 1.27+ depreciou a secao [colors] inteira (inclusive o alpha) em favor
# de [colors-dark] / [colors-light]. Usar a antiga faz o foot imprimir um
# warning por linha de cor a cada terminal aberto.
[colors-dark]
alpha=0.94

background=1a1b26
foreground=c0caf5

selection-background=283457
selection-foreground=c0caf5

urls=73daca

# normal
regular0=15161e
regular1=f7768e
regular2=9ece6a
regular3=e0af68
regular4=7aa2f7
regular5=bb9af7
regular6=7dcfff
regular7=a9b1d6

# bright
bright0=414868
bright1=f7768e
bright2=9ece6a
bright3=e0af68
bright4=7aa2f7
bright5=bb9af7
bright6=7dcfff
bright7=c0caf5

# extras
dim0=414868
search-box-no-match=1a1b26 f7768e
search-box-match=1a1b26 e0af68
scrollback-indicator=1a1b26 7aa2f7

[csd]
preferred=none

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
search-start=Control+Shift+f
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
# show-urls-launch: nao remapear. O padrao Control+Shift+u ja pertence ao
# unicode-input do foot, e o conflito vira um 'error:' impresso a cada
# terminal aberto.
